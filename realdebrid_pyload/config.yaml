name: Real-Debrid to pyLoad
version: "0.3.3"
slug: realdebrid_pyload
description: Unrestricts finished Real-Debrid torrents and sends the links to pyLoad
url: https://github.com/YOUR_GITHUB_USER/ha-apps
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
homeassistant_api: true
options:
  rd_api_token: ""
  pyload_url: "http://192.168.1.10:8000"
  pyload_username: "pyload"
  pyload_password: ""
  pyload_api_key: ""
  poll_interval: 300
  skip_existing_on_first_run: true
  delete_torrent_after_send: false
  verify_ssl: true
  sort_downloads: true
  tv_folder: "TV Shows"
  film_folder: "Movies"
  other_folder: "Other"
  tv_subfolders: true
  film_subfolders: true
schema:
  rd_api_token: password
  pyload_url: url
  pyload_username: str?
  pyload_password: password?
  pyload_api_key: password?
  poll_interval: int(30,86400)
  skip_existing_on_first_run: bool
  delete_torrent_after_send: bool
  verify_ssl: bool
  sort_downloads: bool
  tv_folder: str
  film_folder: str
  other_folder: str
  tv_subfolders: bool
  film_subfolders: bool
